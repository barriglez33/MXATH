name: Update MXATH News RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "9,39 * * * *"

concurrency:
  group: mxath-news-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify repository and dependencies
        shell: bash
        run: |
          set -e
          python --version
          python -m py_compile main.py
          python - <<'PY'
          import json
          import feedparser, requests, bs4, dateutil
          from pathlib import Path
          c=json.loads(Path('config.json').read_text(encoding='utf-8'))
          print('Project:', c['project_name'])
          print('Athletes:',len(c['athletes']))
          assert len(c['athletes']) == 47
          print('Dependencies OK')
          PY
          python -m unittest discover -s tests -v

      - name: Run news scanner
        id: scanner
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -o pipefail
          python -u main.py 2>&1 | tee scanner-run.log

      - name: Show scanner diagnostics
        if: always()
        shell: bash
        run: |
          echo "SCANNER RESULT: ${{ steps.scanner.outcome }}"
          if [ -f scanner-run.log ]; then
            tail -n 300 scanner-run.log
          else
            echo "scanner-run.log was not created"
          fi
          git status --short || true

      - name: Commit generated RSS and data
        if: steps.scanner.outcome == 'success'
        shell: bash
        run: |
          set -e
          git config user.name "MXATH News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Update generated MXATH RSS and data"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt of 5..."
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push succeeded."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts."
              exit 1
            fi
            wait_seconds=$((attempt * 20))
            sleep "$wait_seconds"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
          done

      - name: Fail job when scanner failed
        if: steps.scanner.outcome == 'failure'
        shell: bash
        run: |
          echo "Python scanner failed; inspect diagnostics above."
          exit 1
