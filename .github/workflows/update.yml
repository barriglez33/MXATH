name: Update World Series Editorial RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "9,24,39,54 * * * *"

concurrency:
  group: world-series-editorial-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify repository and dependencies
        shell: bash
        run: |
          set -e
          echo "Python:"
          python --version

          echo "Syntax check:"
          python -m py_compile main.py
          python -m unittest discover -s tests -v

          echo "Config check:"
          python - <<'PY'
          import json
          from pathlib import Path
          with Path('config.json').open(encoding='utf-8') as f:
              config = json.load(f)
          assert 'teams' in config and 'extra_queries' in config
          print('config.json OK')
          print('Project:', config.get('project_name', 'World Series 2026 Editorial RSS'))
          print('Player names:', sum(len(players) for players in config['teams'].values()))
          PY

          echo "Dependency imports:"
          python - <<'PY'
          import feedparser
          import requests
          import bs4
          import dateutil
          print('Feed, HTTP, HTML, and date imports OK')
          PY

      - name: Run editorial news scanner
        id: scanner
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -o pipefail
          python -u main.py 2>&1 | tee scanner-run.log

      - name: Show scanner diagnostics
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "SCANNER RESULT: ${{ steps.scanner.outcome }}"
          echo "============================================================"

          if [ -f scanner-run.log ]; then
            echo "Last 300 log lines:"
            tail -n 300 scanner-run.log
          else
            echo "scanner-run.log was not created."
          fi

          echo "============================================================"
          echo "Git status:"
          git status --short || true
          echo "============================================================"

      - name: Commit generated RSS and data
        if: steps.scanner.outcome == 'success'
        shell: bash
        run: |
          set -e

          git config user.name "World Series News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Update generated World Series editorial RSS and data"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt of 5..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push succeeded."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts."
              exit 1
            fi

            wait_seconds=$((attempt * 20))
            echo "Push failed. Waiting ${wait_seconds} seconds before retry..."
            sleep "$wait_seconds"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

      - name: Fail job when scanner failed
        if: steps.scanner.outcome == 'failure'
        shell: bash
        run: |
          echo "The Python scanner failed."
          echo "Open the 'Show scanner diagnostics' step above for the actual traceback/error."
          exit 1
